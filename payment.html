<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment | GlowPure</title>

  <link rel="stylesheet" href="style.css" />
  <style>
    .payment-box {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .payment-box h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    .total {
      font-size: 20px;
      margin: 20px 0;
      text-align: center;
      font-weight: bold;
    }

    .methods label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
    }

    .pay-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 16px;
      border: none;
      background: #2ecc71;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="payment-box">
    <h2>Payment</h2>

    <div class="total" id="totalAmount">
      Total: ₹0
    </div>

    <div class="methods">
      <h3>Select Payment Method</h3>

      <label>
        <input type="radio" name="payment" checked />
        UPI (Google Pay / PhonePe)
      </label>

      <label>
        <input type="radio" name="payment" />
        Credit / Debit Card
      </label>

      <label>
        <input type="radio" name="payment" />
        Cash on Delivery
      </label>
    </div>

    <button class="pay-btn" onclick="payNow()">Pay Now</button>
  </div>

  <script src="payment.js"></script>
</body>
</html>
